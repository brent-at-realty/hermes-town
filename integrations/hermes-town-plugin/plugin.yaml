name: hermes-town-brent
version: 0.6.0
manifest_version: 2
api_version: 1
requires_hermes: ">=0.21"
description: >-
  Hermes Town Brent: passive Hermes Town bridge. Publishes bounded, pseudonymous
  agent lifecycle metadata to a same-host Town live server. Registers no tools,
  injects no context, and returns no control directive.
author: brent-at-realty
license: MIT
homepage: https://github.com/brent-at-realty/hermes-town
tags: [visualization, observability, privacy]
provides_tools: []
provides_hooks:
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
  - on_session_start
  - on_session_end
  - on_session_finalize
  - on_session_reset
  - subagent_start
  - subagent_stop
